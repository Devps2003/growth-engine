spring:
  application:
    name: publisher-agent
  
  datasource:
    url: jdbc:postgresql://localhost:5432/growthengine
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: none  # Don't create tables (orchestrator does that)
    show-sql: true
  
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123

publisher:
  queue:
    name: publisher-queue

wordpress:
  api:
    enabled: ${WORDPRESS_ENABLED:false}  # Set to true to enable WordPress publishing
    url: ${WORDPRESS_URL:}  # e.g., https://yoursite.wordpress.com or https://yoursite.com
    username: ${WORDPRESS_USERNAME:}  # WordPress username
    password: ${WORDPRESS_PASSWORD:} 