spring:
  application:
    name: writer-agent
  main:
    web-application-type: none
  
  datasource:
    url: jdbc:postgresql://localhost:5432/growthengine
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: none  # Don't create tables (orchestrator does that)
    show-sql: true
  
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123

writer:
  queue:
    name: writer-queue

groq:
  api:
    key: ${GROQ_API_KEY:}  # Use environment variable, fallback to empty if not set
    base-url: https://api.groq.com/openai/v1
    model: llama-3.3-70b-versatile  # Updated model name
    max-tokens: 2000
    temperature: 0.7

